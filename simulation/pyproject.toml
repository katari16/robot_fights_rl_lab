[project]
name = "robot-fights-arena"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mjswan", "mujoco==3.11.0", "numpy>=2.0", "scipy>=1.14",
  "pillow>=11", "resvg-py>=0.2", "imageio>=2.37", "imageio-ffmpeg>=0.6",
]

[dependency-groups]
dev = ["pytest>=8", "playwright>=1.55"]

[tool.uv.sources]
mjswan = { path = "../external/mjswan", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
