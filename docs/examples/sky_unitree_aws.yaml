# Unitree G1 training through SkyPilot. Run from this repository's root:
# sky launch -c robot-fights-unitree docs/examples/sky_unitree_aws.yaml
# Download checkpoints before terminating: sky down robot-fights-unitree
name: robot-fights-unitree

# Sync this editable source directory, including local changes, to ~/sky_workdir.
workdir: external/unitree_rl_mjlab

resources:
  cloud: aws
  accelerators: L4:1
  disk_size: 100

envs:
  TASK: Unitree-G1-Flat
  NUM_ENVS: "512"
  MAX_ITERATIONS: "100"
  SEED: "42"
  # Optional NPZ path on the remote machine, relative to the Unitree checkout.
  MOTION_FILE: ""
  MUJOCO_GL: egl

setup: |
  set -euo pipefail
  sudo apt-get update
  sudo apt-get install -y git curl libegl-dev
  if ! command -v uv >/dev/null 2>&1; then
    curl -LsSf https://astral.sh/uv/install.sh | sh
  fi
  export PATH="$HOME/.local/bin:$PATH"

  cd "$HOME/sky_workdir"
  test -f scripts/train.py
  # Keep dependencies outside the synchronized source directory.
  unitree_env="$HOME/robot_fights_unitree_env"
  if [ ! -x "$unitree_env/bin/python" ]; then
    uv venv --python 3.11 "$unitree_env"
  fi
  uv pip install --python "$unitree_env/bin/python" --editable .

run: |
  set -euo pipefail
  export PATH="$HOME/.local/bin:$PATH"
  cd "$HOME/sky_workdir"
  unitree_python="$HOME/robot_fights_unitree_env/bin/python"
  "$unitree_python" -c 'import torch; assert torch.cuda.is_available(), "CUDA is unavailable; check the GPU driver and PyTorch installation"'

  motion_args=()
  if [ -n "$MOTION_FILE" ]; then
    test -f "$MOTION_FILE" || { echo "Motion file not found: $MOTION_FILE" >&2; exit 1; }
    motion_args=(--motion-file "$MOTION_FILE")
  elif [[ "$TASK" == *Tracking* ]]; then
    echo "Set MOTION_FILE to a Unitree-compatible NPZ for tracking tasks." >&2
    exit 1
  fi

  # Record the synchronized Python sources and installed dependency versions.
  mkdir -p logs
  find scripts src -type f -name '*.py' -print0 | sort -z | xargs -0 sha256sum > logs/source-sha256.txt
  sha256sum setup.py >> logs/source-sha256.txt
  uv pip freeze --python "$unitree_python" > logs/requirements-resolved.txt
  "$unitree_python" scripts/train.py "$TASK" \
    --env.scene.num-envs "$NUM_ENVS" \
    --agent.max-iterations "$MAX_ITERATIONS" \
    --agent.seed "$SEED" \
    --agent.logger tensorboard \
    --gpu-ids all \
    "${motion_args[@]}"
